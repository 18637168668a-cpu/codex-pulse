name: Bug report
description: A reproducible problem with setup, quota data or widget layout
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'Never include credentials, full account responses or private screenshots. Use Security → Report a vulnerability for sensitive issues.'
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS, Apple Silicon/Intel, app version, download or source install, Codex version (Xcode/Node versions only for source installs)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the failing command or widget size/language. Redact personal paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
